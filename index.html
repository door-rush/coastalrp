<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New Future Party</title>
<meta name="description" content="New Future Party — либерально-консервативная партия в RP-мире Roblox Brookhaven. Вступай, следи за новостями и мероприятиями.">
<meta name="theme-color" content="#041544">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23041544'/%3E%3Cpath d='M32 10l6.2 14.6 15.8 1.4-12 10.4 3.6 15.4L32 43.4 18.4 51.8 22 36.4 10 26l15.8-1.4z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#041544;--navy2:#0B2A7A;--sky:#4C86FF;--sky-soft:#E4ECFF;--paper:#F3F5FA;--card:#fff;--ink:#0B1330;--muted:#5B6684;--line:#DCE2F0;--ok:#0F8A4B;--ok-soft:#DDF4E7;--bad:#C4180A;--bad-soft:#FDE3E0;--warn:#9A5B00;--warn-soft:#FFF0D4;
--disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--sh:0 1px 2px rgba(4,21,68,.06),0 10px 30px rgba(4,21,68,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--disp);font-style:italic;font-weight:800;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.005em}
h2{font-size:clamp(34px,5vw,52px)}h3{font-size:26px}
p{margin:0}a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:max(18px,env(safe-area-inset-left))}
.muted{color:var(--muted)}.small{font-size:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
/* шапка */
header.top{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;text-decoration:none}.brand img{height:40px;width:auto;display:block}
nav.menu{display:flex;gap:4px;margin-left:12px;flex:1}
nav.menu a{color:rgba(255,255,255,.78);text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:16px}
nav.menu a:hover{color:#fff;background:rgba(255,255,255,.1)}nav.menu a.on{background:#fff;color:var(--navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 26px;background:var(--sky);color:#fff;font-weight:700;font-size:17px;text-decoration:none;transition:transform .15s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:none}
.btn.navy{background:var(--navy)}.btn.white{background:#fff;color:var(--navy)}.btn.line{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn.sm{padding:8px 16px;font-size:15px}.btn.bad{background:var(--bad-soft);color:var(--bad)}.btn.ok{background:var(--ok);color:#fff}.btn.soft{background:var(--sky-soft);color:var(--navy2)}
@media(max-width:820px){nav.menu{position:fixed;left:0;right:0;bottom:0;margin:0;gap:0;background:var(--navy);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -8px 30px rgba(4,21,68,.3)}
nav.menu a{flex:1;text-align:center;padding:9px 2px;font-size:13px;border-radius:12px}
body{padding-bottom:70px}.bar .btn.join{margin-left:auto}}
@media(min-width:821px){.bar .btn.join{margin-left:auto}}
/* hero */
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden;isolation:isolate}
.hero svg.comet{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .in{padding-block:clamp(56px,9vw,120px) clamp(64px,9vw,120px)}
.hero h1{font-size:clamp(64px,15.5vw,184px);line-height:.86;max-width:9.5em}
.hero p.lead{font-size:clamp(19px,2.4vw,24px);max-width:30em;margin-top:22px;color:rgba(255,255,255,.86)}
.hero .row{margin-top:30px}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:44px;padding-top:22px;border-top:1px solid rgba(255,255,255,.2)}
.stats b{display:block;font:800 italic 44px/1 var(--disp)}.stats span{font-size:15px;color:rgba(255,255,255,.7)}
/* секции */
section.sec{padding:clamp(44px,6vw,80px) 0}.sec.alt{background:#fff}
.head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.pagehead{background:var(--navy);color:#fff;padding:clamp(40px,6vw,76px) 0}.pagehead h1{font-size:clamp(48px,9vw,96px)}.pagehead p{margin-top:12px;color:rgba(255,255,255,.8);max-width:36em;font-size:19px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--card);border-radius:22px;padding:24px;box-shadow:var(--sh);min-width:0}
.card h3{font-size:30px;margin-bottom:8px}
.news{display:flex;flex-direction:column;gap:10px;text-decoration:none;transition:transform .18s}.news:hover{transform:translateY(-3px)}
.news time,.ev time{font-size:14px;color:var(--muted);font-weight:600}
.news p{color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--sky-soft);color:var(--navy2);font-size:13px;font-weight:700}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.ev{display:grid;grid-template-columns:84px 1fr;gap:18px;align-items:start}
.date{background:var(--navy);color:#fff;border-radius:18px;text-align:center;padding:10px 4px}.date b{display:block;font:800 italic 40px/1 var(--disp)}.date span{font-size:13px;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.ev.past{opacity:.6}
.prog{counter-reset:p;display:grid;gap:16px}
.prog li{list-style:none;display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:start;background:#fff;border-radius:22px;padding:22px;box-shadow:var(--sh)}
.prog li::before{counter-increment:p;content:counter(p);font:800 italic 48px/1 var(--disp);color:var(--sky)}
ul.prog{padding:0;margin:0}.prog h3{margin-bottom:4px}
.member{display:flex;gap:14px;align-items:center}.avatar{width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 italic 26px var(--disp);flex:none}
.member.lead .avatar{background:var(--sky)}
.tiers h3{margin:34px 0 14px;font-size:30px}
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}@media(max-width:820px){.about{grid-template-columns:1fr}}
.about .logo{background:var(--navy);border-radius:28px;padding:36px;display:grid;place-items:center}.about .logo img{width:100%;max-width:420px}
.cta{background:var(--navy);color:#fff;border-radius:30px;padding:clamp(28px,5vw,56px);display:grid;gap:14px;justify-items:start;position:relative;overflow:hidden}
.cta h2{font-size:clamp(38px,6vw,64px)}.cta p{color:rgba(255,255,255,.82);max-width:34em}
/* формы */
form.form{display:grid;gap:16px}label{display:grid;gap:6px;font-weight:600;font-size:15px}
input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;font-weight:500;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--sky);box-shadow:0 0 0 4px rgba(76,134,255,.2)}
textarea{min-height:110px;resize:vertical}.g2{display:grid;gap:16px;grid-template-columns:1fr 1fr}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.narrow{max-width:640px}
.empty{border:2px dashed var(--line);border-radius:22px;padding:34px 22px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}
.note{padding:14px 16px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:15px}
/* админка */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px}.tabs button{border:0;background:#fff;border-radius:999px;padding:9px 18px;font-weight:700;white-space:nowrap;box-shadow:var(--sh)}.tabs button.on{background:var(--navy);color:#fff}
.tabs .cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--sky);color:#fff;font-size:13px;margin-left:6px;padding:0 6px}
.list{display:grid;gap:12px}.item{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:var(--sh);display:grid;gap:8px}
.item .row{justify-content:space-between}
footer.foot{background:var(--navy);color:rgba(255,255,255,.75);padding:36px 0 30px;margin-top:0}
footer.foot .cols{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}footer.foot img{height:44px}footer.foot a{color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#111;color:#fff;padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function group(rows){
  var g={news:[],events:[],members:[],apps:[],cfg:{}};
  rows.forEach(function(r){var d=Object.assign({},r.data,{id:r.id,created:r.created_at});
    if(r.coll==="cfg"){if(r.id==="main")g.cfg=r.data}else if(g[r.coll])g[r.coll].push(d)});
  g.news.sort(function(a,b){return (b.ts||0)-(a.ts||0)});
  g.events.sort(function(a,b){return (a.when||0)-(b.when||0)});
  g.apps.sort(function(a,b){return (b.ts||0)-(a.ts||0)});
  return g;
}
async function load(){

}

document.addEventListener("submit",async function(e){
  var f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  var k=f.dataset.form,fd=new FormData(f);function val(n){return String(fd.get(n)||"").trim()}
  var btn=f.querySelector("[type=submit]");if(btn)btn.disabled=true;
  try{
  if(!sb){toast("Нет связи с базой. Обнови страницу");return}
  if(k==="join"){
    var t=val("tg");if(t&&t.charAt(0)!=="@")t="@"+t.replace(/^https?:\/\/t\.me\//,"");
    var r=await sb.from("nfp").insert({coll:"apps",id:uid(),data:{nick:val("nick"),tg:t,fio:val("fio"),age:val("age"),why:val("why"),ts:Date.now(),st:"new"}});
    if(r.error){toast("Не удалось отправить: "+(r.error.message||"ошибка"));return}
    S.joined=true;render();window.scrollTo(0,0);
  }else if(k==="login"){
    var nick=val("nick").toLowerCase().replace(/[^a-z0-9_.-]/g,"");if(!nick){toast("Ник: латиница, цифры, _ . -");return}
    var email=nick+"@nfp.app",pw=val("pw");
    var s=await sb.auth.signInWithPassword({email:email,password:pw});
    if(s.error){var su=await sb.auth.signUp({email:email,password:pw});if(su.error){toast("Не вошли: "+su.error.message);return}
      if(!su.data.session){toast("В Supabase выключи Confirm email (Authentication → Providers → Email)");return}}
    var c=await sb.rpc("nfp_claim_admin",{code:val("code")});
    if(c.data!==true){toast("Неверный код или временная блокировка");await sb.auth.signOut();return}
    S.admin=true;await load();render();
  }else if(k==="news"){
    if(await put("news",uid(),{title:val("title"),text:val("text"),ts:Date.now(),by:""})){toast("Опубликовано")}
  }else if(k==="event"){
    var w2=new Date(val("when")).getTime();if(!w2){toast("Укажи дату");return}
    if(await put("events",uid(),{title:val("title"),when:w2,place:val("place"),desc:val("desc")}))toast("Событие добавлено");
  }else if(k==="member"){
    if(await put("members",uid(),{nick:val("nick"),role:val("role"),note:val("note"),ts:Date.now()}))toast("Добавлен");
  }else if(k==="set"){
    var prog=val("program").split("\n").map(function(l){var p=l.split("|");return {t:p[0].trim(),d:(p.slice(1).join("|")||"").trim()}}).filter(function(p){return p.t});
    if(await put("cfg","main",{slogan:val("slogan"),about:val("about"),tg:val("tg"),recruit:!!fd.get("recruit"),program:prog}))toast("Сохранено");
  }
  }finally{if(btn)btn.disabled=false}
});
