function pic(file,max,q){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q||.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function errMsg(e){var m=(e&&e.message)||"";if(e&&e.code==="23505")return "Это имя уже занято";if(/row-level security|permission denied/.test(m))return "Нет доступа. Проверь, что ты зарегистрирован в приложении";if(/check constraint/.test(m))return "Проверь данные: формат неверный или слишком длинно";return "Ошибка: "+m}
async function db(p){var r=await p;if(r.error){toast(errMsg(r.error));return null}return r.data===undefined?true:(r.data===null?true:r.data)}
async function rpc(n,a){var r=await S.sb.rpc(n,a||{});if(r.error){toast(errMsg(r.error));return null}var d=r.data;if(d&&typeof d==="object"&&!Array.isArray(d)&&d.ok===false){toast(d.msg||"Ошибка");return null}return d===null?true:d}

async function loadCfg(){var r=await S.sb.from("eco_cfg").select("*");if(r.data)r.data.forEach(function(x){S.cfg[x.k]=x.v})}
async function loadMe(){
  var u=S.ses.user.id;await loadCfg();
  var c=await S.sb.from("eco_chars").select("*").eq("uid",u).maybeSingle();S.ch=c.data||null;
  var l=await S.sb.rpc("eco_lvl");S.lvl=(l.data|0)||0;
  if(!S.ch){S.acc=null;S.pass=null;S.wal=[];S.prof={};return}
  var rs=await Promise.all([S.sb.from("eco_accounts").select("*").eq("uid",u).maybeSingle(),S.sb.from("eco_passports").select("*").eq("uid",u).maybeSingle(),
    S.sb.from("eco_wallets").select("*").eq("uid",u),S.sb.from("eco_profiles").select("*").eq("uid",u)]);
  S.acc=rs[0].data||null;S.pass=rs[1].data||null;S.wal=rs[2].data||[];S.prof={};(rs[3].data||[]).forEach(function(p){S.prof[p.app]=p});
}
async function loadTx(){var r=await S.sb.from("eco_tx").select("*").eq("uid",S.ses.user.id).order("id",{ascending:false}).limit(60);S.tx=r.data||[]}
async function loadMarket(){var d=await rpc("eco_market");if(d&&Array.isArray(d))S.mkt=d}
async function loadPeople(){
  var a=await S.sb.from("eco_chars").select("uid,first,last,nick"),b=await S.sb.from("eco_profiles").select("uid,app,handle,bio,avatar");
  var m={};(a.data||[]).forEach(function(c){m[c.uid]={n:c.first+" "+c.last,nick:c.nick,p:{}}});
  (b.data||[]).forEach(function(p){if(!m[p.uid])m[p.uid]={n:"?",nick:"",p:{}};m[p.uid].p[p.app]=p});S.ppl=m;
}
async function loadFeed(app){
  await loadPeople();
  var r=await S.sb.from("eco_posts").select("*").eq("app",app).order("ts",{ascending:false}).limit(40);S.posts=r.data||[];
  var ids=S.posts.map(function(p){return p.id});S.likes={};S.cms={};
  if(ids.length){
    var l=await S.sb.from("eco_likes").select("*").in("post",ids),c=await S.sb.from("eco_comments").select("*").in("post",ids).order("id");
    (l.data||[]).forEach(function(x){var o=S.likes[x.post]||(S.likes[x.post]={n:0,me:false});o.n++;if(x.uid===S.ses.user.id)o.me=true});
    (c.data||[]).forEach(function(x){(S.cms[x.post]||(S.cms[x.post]=[])).push(x)});
  }
}
async function loadConvs(){
  await loadPeople();var me=S.ses.user.id;
  var r=await S.sb.from("eco_msgs").select("*").or("a.eq."+me+",b.eq."+me).order("id",{ascending:false}).limit(400);
  var all=r.data||[],m={};
  all.forEach(function(x){var o=x.a===me?x.b:x.a,c=m[o]||(m[o]={uid:o,last:x,unread:0});if(x.b===me&&!x.read)c.unread++});
  S.convs=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.last.id-a.last.id});S.allMsgs=all;
}

function spark(ser,w,h,col,fill){
  if(!ser||!ser.length)return"";var mn=Math.min.apply(null,ser),mx=Math.max.apply(null,ser),r=(mx-mn)||1,pts=ser.map(function(v,i){return (i/(ser.length-1)*w).toFixed(1)+","+(h-4-((v-mn)/r)*(h-8)).toFixed(1)});
  var line='<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  return fill?'<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".25"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs><polygon points="0,'+h+' '+pts.join(" ")+' '+w+','+h+'" fill="url(#gf)"/>'+line+'</svg>':'<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+line+'</svg>';
}

  await loadMe();
  if(S.app==="bank"&&!S.sub)await loadTx();else if(S.app==="coin"){await loadMarket();if(S.sub==="stk")await loadStockDet();else await loadStocks()}else if(S.app==="biz")await loadBiz();else if(S.app==="rich")await loadRich();else if(S.app==="msg"&&S.prof.msg)await loadConvs();else if((S.app==="photo"||S.app==="work")&&S.prof[S.app]&&!S.tmp.cmp)await loadFeed(S.app);else if(!S.app)await loadConvs();

document.addEventListener("submit",async function(e){

  try{
  if(!S.sb){toast("Нет связи с базой. Обнови страницу");return}
  if(k==="auth"||k==="adm-login"){
    var ses=S.ses;
    if(!ses||k==="auth"){
      var nick=v("nick").toLowerCase().replace(/^@/,"");if(!/^[a-z0-9_]{3,32}$/.test(nick)){toast("Ник: 3–32 символа, латиница, цифры и _ (без пробелов и точек)");return}

      else{r=await S.sb.auth.signInWithPassword({email:email,password:pw});
        if(r.error){if(k==="adm-login"){var su=await S.sb.auth.signUp({email:email,password:pw});if(su.error||!su.data.session){toast("Не удалось войти: "+(su.error?su.error.message:"проверь ник и пароль"));return}ses=su.data.session}
          else{toast("Неверный ник или пароль");return}}else ses=r.data.session}

  }
  else if(k==="comment"){
    var pid=f.dataset.id;if(!(await db(S.sb.from("eco_comments").insert({post:pid,body:v("body")}))))return;
    (S.cms[pid]||(S.cms[pid]=[])).push({uid:S.ses.user.id,body:v("body")});render();
  }
  else if(k==="msg"){
    var b=v("body");if(!b)return;if(!(await db(S.sb.from("eco_msgs").insert({b:S.chat,body:b}))))return;await loadConvs();render();
  }
  else if(k==="find"){
    var h=v("h").toLowerCase().replace(/^@/,""),hit=null;
    await loadPeople();Object.keys(S.ppl).forEach(function(u){var p=S.ppl[u].p.msg;if(p&&p.handle.toLowerCase()===h)hit=u});
    if(!hit){toast("Такого пользователя в "+BR.msg[0]+" нет");return}if(hit===S.ses.user.id){toast("Это ты");return}
    S.chat=hit;await markRead();render();
  }
  else if(k==="credit"){
    var a2=parseFloat(v("amt").replace(",","."));var d4=await rpc("eco_credit",{p_uid:v("uid"),p_amt:a2,p_note:v("note")});if(d4){toast("Готово. Баланс: "+money(d4.bal));await loadAdmin();render()}
  }
  else if(k==="coin"){
    var sym=f.dataset.sym;var u={base:parseFloat(v("base")),vol:parseFloat(v("vol")),per:parseFloat(v("per")),on_:!!fd.get("on")};
    if(await db(S.sb.from("eco_coins").update(u).eq("sym",sym))){toast("Сохранено");await loadAdmin();render()}
  }
  else if(k==="coin-new"){
    var n={sym:v("sym").toUpperCase(),name:v("name"),base:parseFloat(v("base").replace(",",".")),vol:parseFloat(v("vol").replace(",","."))||0.3,per:3600,ph:Math.random()*6,on_:true};
    if(await db(S.sb.from("eco_coins").insert(n))){toast("Монета добавлена");await loadAdmin();render()}
  }
  else if(k==="cfg"){
    var rows=["start_bal","passport_fee","fee_pct","sort","biz_fee","biz_min_capital"].map(function(x){return {k:x,v:v(x)}});
    if(await db(S.sb.from("eco_cfg").upsert(rows))){rows.forEach(function(r){S.cfg[r.k]=r.v});toast("Сохранено");render()}
  }
  }finally{if(btn)btn.disabled=false}
});
document.addEventListener("input",async function(e){
  var t=e.target;if(t.dataset&&t.dataset.k)S.tmp[t.dataset.k]=t.value;
  if(t.dataset&&t.dataset.act==="acc"){
    var val=t.value.trim(),r=$("#rcpt");S.tmp.t_name="";
    if(/^\d{8}$/.test(val)){var n=await S.sb.rpc("eco_acc_lookup",{p_acc:val});S.tmp.t_name=n.data?"Получатель: "+n.data:"Счёт не найден";if(r)r.textContent=S.tmp.t_name}else if(r)r.textContent="";
  }
  if(t.dataset&&t.dataset.act==="sqty"){var el2=$("#est");if(S.sdet&&el2)el2.textContent=stkEst(S.tmp.side||"buy",parseInt(t.value,10)||0,S.sdet.stats,Number(S.cfg.fee_pct||0))}
  if(t.dataset&&t.dataset.act==="qty"){var c=coinBy(S.arg),el=$("#est");if(c&&el)el.textContent=estTxt(S.tmp.side||"buy",(parseFloat(t.value.replace(",","."))||0)*c.price,Number(S.cfg.fee_pct||0))}
});
document.addEventListener("change",async function(e){
  var t=e.target,act=t.dataset&&t.dataset.act;if(!act)return;
  if(t.type==="file"&&t.files&&t.files[0]){
    try{
      if(act==="ppfile")S.tmp.pp=await pic(t.files[0],480,.74);
      else if(act==="avfile")S.tmp.av=await pic(t.files[0],160,.8);
      else if(act==="postimg")S.tmp.pimg=await pic(t.files[0],720,.72);
      render();
    }catch(er){toast("Не удалось прочитать изображение")}
  }
  if(act==="staff"){var d=await rpc("eco_set_staff",{p_uid:t.dataset.id,p_lvl:parseInt(t.value,10)});if(d){toast("Сохранено");await loadAdmin();render()}else{await loadAdmin();render()}}
});
window.addEventListener("hashchange",async function(){
  if(isAdminRoute()&&S.ses&&S.lvl)await loadAdmin();
  S.app=isAdminRoute()?S.app:S.app;render();
});
/* ---------- старт ---------- */
function loadSb(cb){
  var urls=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js","https://unpkg.com/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"],i=0;
  (function next(){
    if(window.supabase&&window.supabase.createClient)return cb();
    if(i>=urls.length)return cb();
    var s=document.createElement("script");s.src=urls[i++];s.onload=function(){cb()};s.onerror=next;document.head.appendChild(s);
  })();
}
render();
loadSb(async function(){
  if(!(window.supabase&&window.supabase.createClient)){S.boot=true;render();toast("Не загрузилась библиотека базы. Обнови страницу");return}
  S.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  var s=await S.sb.auth.getSession();S.ses=s.data&&s.data.session;
  try{if(S.ses){await loadMe();if(S.ch)await loadConvs().catch(function(){})}}catch(e){}
  S.boot=true;if(isAdminRoute()&&S.lvl)await loadAdmin();render();
  setInterval(refresh,8000);
  setInterval(function(){document.querySelectorAll("[data-clock]").forEach(function(c){c.textContent=clockStr()})},15000);
});
})();
</script>
